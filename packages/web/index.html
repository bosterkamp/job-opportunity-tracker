<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Job Opportunity Tracker</title>
    <!-- Installable on phones (feature 006). iPhones read their own tags as well as the manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-title" content="Job Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The banner's sky (feature 008), in both colour schemes; the iPhone app's status bar is
         translucent, so the banner runs up behind it. -->
    <meta name="theme-color" content="#140230" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140230" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
