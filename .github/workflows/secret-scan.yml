name: Secret scan

# Every day, scan the whole git history for secrets (API keys, AWS credentials, tokens, private
# keys) with gitleaks. A finding fails the run, and GitHub emails the owner about a failed
# scheduled run. Findings are redacted in the log. It can also be run by hand.
on:
  schedule:
    # 07:00 UTC daily (GitHub may start scheduled runs a little late).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret removed in a later commit is still in the repository.
          fetch-depth: 0
      - name: Scan every commit
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --verbose
